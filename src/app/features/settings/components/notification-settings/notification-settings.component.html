<section class="panel alternate-panel">
  <h1><span class="material-symbol">notifications_active</span> Notification Preferences</h1>
  <p class="panel-description">Choose how you want to receive important account and property updates.</p>
  <div class="preference-row">
    <div><strong>Email notifications</strong><span>Invoices, rent updates, and account activity</span></div>
    <mat-checkbox checked aria-label="Email notifications"></mat-checkbox>
  </div>
  <div class="preference-row">
    <div><strong>SMS alerts</strong><span>Urgent payment and security notifications</span></div>
    <mat-checkbox checked aria-label="SMS alerts"></mat-checkbox>
  </div>
  <div class="preference-row">
    <div><strong>Product updates</strong><span>News about features and service improvements</span></div>
    <mat-checkbox aria-label="Product updates"></mat-checkbox>
  </div>
  <div class="form-actions"><button mat-flat-button class="primary-button" type="button"><span class="material-symbol">save</span> Save Preferences</button></div>
</section>
