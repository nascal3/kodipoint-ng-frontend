<section class="settings-page" aria-label="SettingsService">
  <mat-tab-group class="settings-tabs" animationDuration="300ms">
    <mat-tab>
      <ng-template mat-tab-label>
        <span class="material-symbol" aria-hidden="true">badge</span>
        <span>Personal Profile</span>
      </ng-template>
      <app-profile-settings />
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        <span class="material-symbol" aria-hidden="true">notifications_active</span>
        <span>Notification Preferences</span>
      </ng-template>
      <app-notification-settings />
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        <span class="material-symbol" aria-hidden="true">business</span>
        <span>Agency &amp; Billing</span>
      </ng-template>
      <app-agency-settings />
    </mat-tab>
  </mat-tab-group>
</section>
