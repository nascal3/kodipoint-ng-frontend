<aside class="sidebar" [class.is-collapsed]="collapsed()" aria-label="Main Navigation">
  <div class="sidebar-header">
    @if (!collapsed()) {
      <a routerLink="/dashboard" class="brand-link" aria-label="KodiPoint Home">
        <img src="/kodipoint.svg" alt="KodiPoint Logo">
        <span class="brand-name">kodipoint</span>
      </a>

      <button
        mat-icon-button
        class="toggle-btn"
        (click)="toggleCollapse()"
        aria-label="Collapse sidebar"
        type="button"
      >
        <mat-icon class="toggle-icon">menu_open</mat-icon>
      </button>
    } @else {
      <a
        routerLink="/dashboard"
        class="brand-logo-collapsed"
        aria-label="KodiPoint Home"
        matTooltip="KodiPoint"
        matTooltipPosition="right"
      >
        <div class="logo-box">
          <img src="/kodipoint-white.svg" alt="KodiPoint Logo">
        </div>
      </a>
    }
  </div>

  <nav class="sidebar-nav">
    @for (section of navSections(); track section.title) {
      <div class="nav-section">
        @if (!collapsed()) {
          <h2 class="section-title">{{ section.title }}</h2>
        }
        <ul class="nav-list">
          @for (item of section.items; track item.path) {
            <li class="nav-list-item">
              <a
                [routerLink]="item.path"
                [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
                routerLinkActive="active"
                class="nav-link"
                [matTooltip]="item.label"
                [matTooltipDisabled]="!collapsed()"
                matTooltipPosition="right"
              >
                <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
                @if (!collapsed()) {
                  <span class="nav-label">{{ item.label }}</span>
                }
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</aside>
